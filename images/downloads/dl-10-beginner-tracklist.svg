<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070A"/>
      <stop offset="50%" stop-color="#14141E"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="gold10" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#FFF2B2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg10)"/>
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#E5C158" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Headphones vector -->
  <path d="M 260 220 A 140 140 0 0 1 540 220" fill="none" stroke="url(#gold10)" stroke-width="12" stroke-linecap="round"/>
  <!-- Ear cups -->
  <rect x="230" y="200" width="40" height="80" rx="12" fill="#1C1E2A" stroke="url(#gold10)" stroke-width="3"/>
  <rect x="530" y="200" width="40" height="80" rx="12" fill="#1C1E2A" stroke="url(#gold10)" stroke-width="3"/>

  <!-- Tracklist Checklist Graphic in Center -->
  <rect x="300" y="100" width="200" height="230" rx="10" fill="#141622" stroke="url(#gold10)" stroke-width="2"/>
  <text x="400" y="130" fill="url(#gold10)" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="2">BEGINNER PLAYLIST</text>
  
  <line x1="320" y1="150" x2="480" y2="150" stroke="#2D3248" stroke-width="2"/>
  
  <!-- Items -->
  <text x="330" y="175" fill="#27C93F" font-family="sans-serif" font-size="12" font-weight="bold">✓ 01. Intro Warmup (90 BPM)</text>
  <text x="330" y="205" fill="#27C93F" font-family="sans-serif" font-size="12" font-weight="bold">✓ 02. Commercial Hits (128 BPM)</text>
  <text x="330" y="235" fill="#27C93F" font-family="sans-serif" font-size="12" font-weight="bold">✓ 03. Peak Hour Anthem (130 BPM)</text>
  <text x="330" y="265" fill="#27C93F" font-family="sans-serif" font-size="12" font-weight="bold">✓ 04. Transition Edit (100-128)</text>
  <text x="330" y="295" fill="#E5C158" font-family="sans-serif" font-size="12" font-weight="bold">★ Starter Library Guide</text>

  <!-- Badge -->
  <rect x="280" y="360" width="240" height="40" rx="20" fill="#1C1E2A" stroke="url(#gold10)" stroke-width="2"/>
  <text x="400" y="385" fill="url(#gold10)" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">0 TO HERO DJ STARTER GUIDE</text>

  <!-- Text -->
  <text x="400" y="445" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="3">DJ TRACK LIST FOR BEGINNERS</text>
  <text x="400" y="485" fill="#A2ACBE" font-family="sans-serif" font-size="14" text-anchor="middle">ESSENTIAL STARTER SONGS &amp; MUSIC BUILDING BLOCKS</text>
</svg>
