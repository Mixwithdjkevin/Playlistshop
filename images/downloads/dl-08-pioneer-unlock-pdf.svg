<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080C"/>
      <stop offset="50%" stop-color="#0E121B"/>
      <stop offset="100%" stop-color="#040608"/>
    </linearGradient>
    <linearGradient id="gold8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#FFF2B2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg8)"/>
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#E5C158" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Technical Circuit / Blueprint Grid Background -->
  <g stroke="#E5C158" stroke-opacity="0.12" stroke-width="1">
    <line x1="100" y1="60" x2="100" y2="400"/>
    <line x1="250" y1="60" x2="250" y2="400"/>
    <line x1="400" y1="60" x2="400" y2="400"/>
    <line x1="550" y1="60" x2="550" y2="400"/>
    <line x1="700" y1="60" x2="700" y2="400"/>

    <line x1="60" y1="100" x2="740" y2="100"/>
    <line x1="60" y1="200" x2="740" y2="200"/>
    <line x1="60" y1="300" x2="740" y2="300"/>
  </g>

  <!-- DJ Controller Schematic Outline -->
  <rect x="180" y="100" width="440" height="220" rx="12" fill="#121622" stroke="url(#gold8)" stroke-width="2"/>
  <circle cx="280" cy="210" r="60" fill="#1A2030" stroke="#E5C158" stroke-width="2"/>
  <circle cx="520" cy="210" r="60" fill="#1A2030" stroke="#E5C158" stroke-width="2"/>

  <!-- Unlock Padlock Graphic -->
  <circle cx="400" cy="180" r="30" fill="#1A2030" stroke="url(#gold8)" stroke-width="3"/>
  <rect x="385" y="180" width="30" height="35" rx="4" fill="url(#gold8)"/>
  <path d="M 390 180 L 390 165 A 10 10 0 0 1 410 165 L 410 175" fill="none" stroke="url(#gold8)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- PDF Folder Badge -->
  <rect x="250" y="350" width="300" height="45" rx="8" fill="#1A2030" stroke="url(#gold8)" stroke-width="2"/>
  <text x="400" y="379" fill="url(#gold8)" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">PIONEER DJ SERVICE &amp; UNLOCK PDFs</text>

  <!-- Text -->
  <text x="400" y="445" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="2">PIONEER UNLOCK DEVICE SETTINGS &amp; SERVICE PDFs</text>
  <text x="400" y="485" fill="#9BA8C0" font-family="sans-serif" font-size="14" text-anchor="middle">HARDWARE UNLOCK GUIDES &amp; OFFICIAL SERVICE MANUALS</text>
</svg>
