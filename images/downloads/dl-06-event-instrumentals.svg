<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0805"/>
      <stop offset="50%" stop-color="#1A140B"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>
    <linearGradient id="gold6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="100%" stop-color="#C2942B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg6)"/>
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#F5D77F" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Stage Lights & Bokeh -->
  <g opacity="0.3">
    <circle cx="150" cy="120" r="80" fill="#FFD700"/>
    <circle cx="650" cy="120" r="80" fill="#FFD700"/>
    <circle cx="280" cy="80" r="50" fill="#FFF"/>
    <circle cx="520" cy="80" r="50" fill="#FFF"/>
  </g>

  <!-- PA Speaker Left -->
  <rect x="120" y="160" width="90" height="180" rx="10" fill="#15110A" stroke="url(#gold6)" stroke-width="2"/>
  <circle cx="165" cy="205" r="25" fill="#221B10" stroke="#F5D77F"/>
  <circle cx="165" cy="280" r="35" fill="#221B10" stroke="#F5D77F"/>

  <!-- PA Speaker Right -->
  <rect x="590" y="160" width="90" height="180" rx="10" fill="#15110A" stroke="url(#gold6)" stroke-width="2"/>
  <circle cx="635" cy="205" r="25" fill="#221B10" stroke="#F5D77F"/>
  <circle cx="635" cy="280" r="35" fill="#221B10" stroke="#F5D77F"/>

  <!-- Gold Vintage Microphone in Center -->
  <rect x="385" y="150" width="30" height="80" rx="15" fill="#221B10" stroke="url(#gold6)" stroke-width="3"/>
  <line x1="385" y1="170" x2="415" y2="170" stroke="url(#gold6)" stroke-width="2"/>
  <line x1="385" y1="190" x2="415" y2="190" stroke="url(#gold6)" stroke-width="2"/>
  <line x1="400" y1="150" x2="400" y2="230" stroke="url(#gold6)" stroke-width="2"/>
  <!-- Stand -->
  <line x1="400" y1="230" x2="400" y2="350" stroke="url(#gold6)" stroke-width="4"/>
  <polygon points="360,350 440,350 420,360 380,360" fill="url(#gold6)"/>

  <!-- Text -->
  <text x="400" y="420" fill="url(#gold6)" font-family="sans-serif" font-size="26" font-weight="900" text-anchor="middle" letter-spacing="3">DJ KEVIN EVENT INSTRUMENTALS</text>
  <text x="400" y="460" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">BACKGROUND MUSIC &amp; EVENT ATMOSPHERE TRACKS</text>
  <text x="400" y="490" fill="#B5A178" font-family="sans-serif" font-size="13" text-anchor="middle">SUITABLE FOR WEDDINGS, PRIVATE GIGS &amp; CORPORATE SHOWS</text>
</svg>
