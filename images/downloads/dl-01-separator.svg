<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="50%" stop-color="#121018"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#FFF2B2"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#E5C158" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Waveform Stems -->
  <!-- Stem 1: Vocals -->
  <text x="60" y="150" fill="#E5C158" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2">VOCALS / STEM 1</text>
  <path d="M 60 180 Q 150 120 240 180 T 420 180 T 600 180 T 740 180" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <path d="M 60 180 Q 110 140 160 180 T 260 180 T 460 180 T 740 180" fill="none" stroke="#E5C158" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Stem 2: Drums -->
  <text x="60" y="230" fill="#E5C158" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2">DRUMS / STEM 2</text>
  <path d="M 60 260 L 100 220 L 120 290 L 160 230 L 200 270 L 250 210 L 300 280 L 380 220 L 450 270 L 520 210 L 600 280 L 740 260" fill="none" stroke="#FF9900" stroke-width="2.5"/>

  <!-- Stem 3: Bass -->
  <text x="60" y="310" fill="#E5C158" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2">BASS &amp; INSTRUMENTS</text>
  <path d="M 60 340 Q 200 400 350 320 T 600 350 T 740 340" fill="none" stroke="url(#stemGrad)" stroke-width="3"/>

  <!-- Center Badge -->
  <rect x="230" y="390" width="340" height="70" rx="35" fill="#18150C" stroke="url(#gold)" stroke-width="2"/>
  <text x="400" y="433" fill="url(#gold)" font-family="sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="3">90 — 160 BPM</text>

  <!-- Title Bottom -->
  <text x="400" y="500" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="4">DJ SEPARATOR STEM FILES</text>
  <text x="400" y="530" fill="#A0A0A0" font-family="sans-serif" font-size="14" text-anchor="middle">CLEAN ISOLATED SEPARATORS FOR REMIXES &amp; EDITS</text>
</svg>
