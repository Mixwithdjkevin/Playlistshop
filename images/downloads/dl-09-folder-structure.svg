  <!-- Text -->
  <text x="400" y="440" fill="url(#gold9)" font-family="sans-serif" font-size="26" font-weight="900" text-anchor="middle" letter-spacing="3">DJ FOLDER STRUCTURE FOR SAMPLES</text>
  <text x="400" y="480" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">PROVEN DIRECTORY SYSTEM FOR DJ MUSIC ORGANISATION</text>
