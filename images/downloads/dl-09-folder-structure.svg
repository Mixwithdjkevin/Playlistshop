      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="50%" stop-color="#12121A"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="gold9" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#FFF2B2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg9)"/>
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#E5C158" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Folder Directory Tree -->
  <g font-family="sans-serif" font-size="14" font-weight="bold">
