    <path d="M 180 80 L 230 80 L 245 95 L 360 95 L 360 120 L 180 120 Z" fill="#E5C158"/>
    <text x="200" y="108" fill="#000">📁 00_DJ_KEVIN_MASTER_LIBRARY</text>

    <!-- Branch 1 -->
    <line x1="210" y1="120" x2="210" y2="170" stroke="#E5C158" stroke-width="2"/>
    <line x1="210" y1="170" x2="240" y2="170" stroke="#E5C158" stroke-width="2"/>
    <rect x="240" y="150" width="340" height="35" rx="6" fill="#1C1E2A" stroke="#E5C158"/>
    <text x="260" y="173" fill="#FFF">📂 01_HOT_CUE_PREP_PACKS</text>

    <!-- Branch 2 -->
    <line x1="210" y1="170" x2="210" y2="230" stroke="#E5C158" stroke-width="2"/>
    <line x1="210" y1="230" x2="240" y2="230" stroke="#E5C158" stroke-width="2"/>
    <rect x="240" y="210" width="340" height="35" rx="6" fill="#1C1E2A" stroke="#E5C158"/>
    <text x="260" y="233" fill="#FFF">📂 02_SAMPLE_PACKS_AND_LOOPS (.SPP)</text>

    <!-- Branch 3 -->
    <line x1="210" y1="230" x2="210" y2="290" stroke="#E5C158" stroke-width="2"/>
