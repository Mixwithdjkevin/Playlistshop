    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)"/>
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#E5C158" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Laptop Screen Frame -->
  <rect x="120" y="80" width="560" height="340" rx="12" fill="#12131C" stroke="#E5C158" stroke-opacity="0.4" stroke-width="2"/>
  
  <!-- Rekordbox Header -->
  <rect x="120" y="80" width="560" height="40" rx="12" fill="#1A1C28"/>
  <circle cx="150" cy="100" r="6" fill="#FF5F56"/>
  <circle cx="170" cy="100" r="6" fill="#FFBD2E"/>
  <circle cx="190" cy="100" r="6" fill="#27C93F"/>
  <text x="400" y="105" fill="url(#gold2)" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">REKORDBOX &amp; MP3 PLAYLIST DEMO</text>

  <!-- Waveform Display inside screen -->
  <rect x="140" y="140" width="520" height="70" rx="6" fill="#090A10" stroke="#2A2D3F"/>
  <path d="M 150 175 L 180 150 L 200 190 L 230 160 L 270 185 L 310 145 L 360 195 L 420 155 L 480 180 L 530 145 L 590 180 L 640 175" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <path d="M 150 175 L 180 160 L 200 180 L 230 165 L 270 178 L 310 155 L 360 185 L 420 165 L 480 172 L 530 158 L 590 172 L 640 175" fill="none" stroke="#E5C158" stroke-width="2"/>

  <!-- Hot Cue Dots -->
  <circle cx="200" cy="175" r="7" fill="#FF0055"/>
  <text x="200" y="160" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">A</text>
  <circle cx="310" cy="175" r="7" fill="#00FF88"/>
  <text x="310" y="160" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">B</text>
  <circle cx="420" cy="175" r="7" fill="#FFBB00"/>
  <text x="420" y="160" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">C</text>

  <!-- Track List Rows -->
  <rect x="140" y="225" width="520" height="25" fill="#1B1E2D" rx="4"/>
  <text x="160" y="242" fill="#E5C158" font-family="sans-serif" font-size="11" font-weight="bold">01. Bollywood Mainstay Intro [Hot Cue Prep]</text>
  <text x="600" y="242" fill="#8A8D9B" font-family="sans-serif" font-size="11">128 BPM</text>

  <rect x="140" y="255" width="520" height="25" fill="#141622" rx="4"/>
  <text x="160" y="272" fill="#FFF" font-family="sans-serif" font-size="11">02. Commercial Dance Floor Transition Edit</text>
  <text x="600" y="272" fill="#8A8D9B" font-family="sans-serif" font-size="11">130 BPM</text>

  <rect x="140" y="285" width="520" height="25" fill="#1B1E2D" rx="4"/>
  <text x="160" y="302" fill="#FFF" font-family="sans-serif" font-size="11">03. Punjabi Roadshow Hype Warmup Cue</text>
  <text x="600" y="302" fill="#8A8D9B" font-family="sans-serif" font-size="11">100 BPM</text>

  <!-- Laptop Base -->
  <path d="M 80 420 L 720 420 L 750 440 L 50 440 Z" fill="#222533" stroke="#E5C158" stroke-opacity="0.3"/>

  <!-- Footer Banner -->
  <text x="400" y="500" fill="#FFFFFF" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="3">FREE REKORDBOX &amp; MP3 DEMO</text>
  <text x="400" y="530" fill="#E5C158" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">FULL PLAYLIST PREPARATION &amp; HOT CUE TEST PACK</text>
